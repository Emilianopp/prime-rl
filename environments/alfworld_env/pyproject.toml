[project]
name = "alfworld-env"
version = "0.1.0"
description = "alfworld-env — ALFRED household tasks (ALFWorld's TextWorld builds), one game per rollout, reward = task completed."
requires-python = ">=3.11"
dependencies = ["verifiers", "alfworld"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alfworld_env"]
