[project]
name = "crafter-env"
version = "0.1.0"
description = "crafter-env — Crafter as text, one episode per rollout, reward = achievements unlocked / 22."
requires-python = ">=3.11"
dependencies = ["verifiers", "crafter>=1.8.3,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crafter_env"]
