# memopt round 2: e_v7_brief
env.player.memory.prompt = '''
MEMORY
You have a memory that is kept for the whole game, across context resets: named entries (keys) of text that you organize however you like. Edit it with tags in your reply, after your reasoning and before your action tags (tags inside your reasoning are ignored):
  <write key="NAME">text</write> adds text to the end of an entry (creates it if new)
  <rewrite key="NAME">text</rewrite> replaces the whole entry
  <replace key="NAME"><old>exact text</old><new>new text</new></replace> replaces every occurrence of the exact text
  <delete key="NAME">exact text</delete> removes that text; <delete key="NAME"/> removes the entry
  <read key="NAME"/> shows the entry's full text at the top of your next observation
Memory tags do not use up a turn. Every observation starts with a [Memory] line listing your keys and their sizes, then the results of your last edits. An entry holds at most {max_key_tokens} tokens: once it is full, an edit that makes it longer is not saved; free space with rewrite or delete. After a context reset, start by reading the entries you need. After a context reset, your first reply must read every entry (one <read> tag per key) before doing anything else.
WHY YOUR MEMORY MATTERS
You forget fast. You see only your last 50 replies, and every ~25 replies your whole context is reset: after a reset you keep only your handoff summary and your memory. Every fact you did not write down is gone: where the trees, water, stone, your table and furnace are, which actions worked, what killed you. Players who write to memory on almost every turn do far better, because they never search twice for the same thing.
KEEP THESE ENTRIES
  MAP: landmarks with their absolute positions from the HUD's Pos, one per line, e.g. "table (24,22)", "trees (18-20,14)", "water (31,25)", "stone (12,30)". Add a line whenever you see something new; delete lines that turn out wrong.
  RULES: game mechanics you confirmed from the [Message], e.g. "DO on a tree gives 1 wood", "wood pickaxe needs a table nearby and 1 wood".
  STATUS: tools, key inventory and achievements so far (rewrite it when it changes).
  PLAN: your current goal and next steps (rewrite it when your goal changes).
  DANGERS: what hurt or killed you and where.
EXAMPLE of a reply that uses memory well (the reasoning comes first, then the tags, then the actions):
  ...reasoning ends...
  <write key="MAP">tree cluster (18-20,14); water (31,25)</write>
  <rewrite key="PLAN">1. collect 3 wood at (19,14) 2. place table 3. make wood pickaxe</rewrite>
  <action>MOVE_LEFT</action>
  <action>DO</action>
Write memory tags only in your visible reply, after you have finished thinking: tags written while thinking are thrown away.
Keep your thinking short (a few sentences): long thinking runs out of tokens and loses the turn.'''
env.player.memory.turn_note = '''
Before your action tags, update your memory: did you see a resource, mob or structure at a new position (add it to MAP with its absolute position)? did an action do something you did not expect (add the rule to RULES)? did your goal or inventory change (rewrite PLAN or STATUS)? Write at least one memory tag in every reply.'''
env.player.memory.summary_note = '''
Your memory is kept across the reset and your summary is short: before the reset, make sure everything you will need is in memory (rewrite STATUS and PLAN now). In the summary, list your memory keys; your first reply after the reset must read them with <read> tags.'''
