# Inference-only continuous full Craftax (craftax-env, GlyphBench's glyph observations)
# under KV-Streams: Qwen3.5-4B in thinking mode, the policy as it is. The counterpart of
# configs/crafter/eval-continuous.toml: no turn limit, and a death respawns the player
# on the Overworld near the spawn point with full vitals and an empty inventory, so an
# episode is one long game, run as segments (once a segment has added new_tokens, the
# model writes a summary of at most summary_tokens and the next segment starts from the
# system prompt, that summary and the current observation). Episodes end on the wall
# clock (max_episode_seconds) or the boss's defeat. Reward: the unlocked achievements'
# Craftax reward / 226 (the health term would charge every death again). Serve
# configs/crafter/inference-kve.toml first; scripts/craftax/eval.sbatch CONTINUOUS=1
# runs both.
#
#   uv run eval @ configs/craftax/eval-continuous.toml

model = "Qwen/Qwen3.5-4B"
group_size = 1

[client]
base_url = "http://localhost:8000/v1"
api_key_var = "VLLM_API_KEY"
# Any admin URL enables releasing each episode's session when it finishes.
admin_base_url = ["http://localhost:8000/v1"]

[renderer]  # token-in/out with the trace id as session id, as in training
name = "qwen3.5"
enable_thinking = true
thinking_retention = "all"

[concurrency]
min_inflight = 64
max_inflight = 64

[select]
limit = 64

[sampling]
max_completion_tokens = 2048
temperature = 1.0

[[source]]
name = "craftax"
env.taskset.id = "craftax-env"
env.taskset.split = "eval"
env.taskset.max_output_tokens = 2048  # the budget the system prompt states: keep = max_completion_tokens
env.taskset.respawn = true  # the system prompt states the continuous rules
env.max_episode_steps = 0  # no turn limit
env.on_death = "respawn"
env.death_inventory = "drop_all"
env.reward = "achievements"
env.max_episode_seconds = 9000  # 2.5 h: ends inside a 3 h block (~10 min to start, the rest to finish)
# Upstream plays long games as segments (env.player.segments.new_tokens = 131072,
# summary_tokens = 32768). This branch's verifiers has no segments yet, so a game
# ends at the token ceiling below instead (the Crafter eval's 256k).
env.player.max_total_tokens = 256000
env.player.harness.id = "inline-chat"
env.player.runtime.type = "subprocess"
serve.pool.type = "elastic"
serve.pool.multiplex = 16
