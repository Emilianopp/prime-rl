# TextWorld eval (inference only): pre-generated games, reasoning then one <action>
# per turn, up to 200 actions, reward = final score / max score. Serve
# configs/textworld/inference.toml first.
#
#   uv run eval @ configs/textworld/eval.toml

model = "Qwen/Qwen3.5-9B"
group_size = 1

[client]
base_url = "http://localhost:8000/v1"
api_key_var = "VLLM_API_KEY"
# Any admin URL enables releasing each episode's session when it finishes.
admin_base_url = ["http://localhost:8000/v1"]

[renderer]  # token-in/out with the trace id as session id, as in training
name = "qwen3.5"
enable_thinking = false
thinking_retention = "all"

[concurrency]
min_inflight = 64
max_inflight = 64

[sampling]
max_completion_tokens = 1024
temperature = 1.0

[[source]]
name = "textworld"
env.taskset.id = "textworld-env"
env.taskset.dataset_path = "textworld_data"
env.taskset.split = "eval"
env.max_episode_steps = 200
# Trace tokens; 64 episodes x 64k stays under 4 engines' KV, so pinned
# concurrency cannot deadlock on a full cache.
env.player.max_total_tokens = 65536
env.player.harness.id = "inline-chat"
env.player.runtime.type = "subprocess"
serve.pool.type = "elastic"
serve.pool.multiplex = 16
