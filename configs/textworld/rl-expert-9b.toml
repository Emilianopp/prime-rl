# RL on the expert TextWorld set (25k expert cooking + 25k expert coin_collector)
# with Qwen3.5-9B, full context, dynamic concurrency. 2 trainer + 2 inference GPUs
# (A100-80GB), one node. Base-model pass rate on this set: ~15% (cooking scores
# spread over 0-17 points; coin_collector win/lose).
#
#   rl @ configs/textworld/rl-expert-9b.toml --inference.sglang.python <SGLang fork venv>/bin/python
#
# KV-Streams arm later: add [inference.sglang.eviction] (max_turns, stride) and the
# two hybrid-model flags marked below; everything else stays the same.

max_steps = 200
seq_len = 65536  # whole episode in one sample; matches the trace cap below

[deployment]
num_train_gpus = 2
num_infer_gpus = 2

[weight_broadcast]
type = "filesystem"  # the SGLang backend supports filesystem weight updates only

[model]
name = "Qwen/Qwen3.5-9B"

[trainer.optim]
lr = 1e-6
weight_decay = 0.01
max_norm = 1.0

[ckpt]  # 3-hour blocks: bank progress often, keep little (a 9B ckpt is ~100 GB)
interval = 5
keep_last = 2

[orchestrator]
batch_size = 256

[orchestrator.train]
group_size = 8  # 32 games x 8: at a ~15% pass rate, ~70% of groups see a win

[orchestrator.concurrency]
# Dynamic: start at the ceiling, the controller trims to what the KV pool holds.
initial_inflight = 512
max_inflight = 512
min_inflight = 4

[orchestrator.renderer]
name = "qwen3.5"
enable_thinking = true
thinking_retention = "all"  # keep past thinking: bridge each turn on the sampled tokens

[orchestrator.train.sampling]
max_completion_tokens = 1024
temperature = 1.0

[[orchestrator.train.source]]
name = "textworld-expert"
env.taskset.id = "textworld-env"
env.taskset.dataset_path = "/network/scratch/e/emiliano.penaloza/kv-race/data/textworld_expert_cooking5x12_coin221-233_total50256_train50000_eval256_seed20261026"
env.taskset.split = "train"
env.max_episode_steps = 200
env.player.max_total_tokens = 65536
env.player.harness.id = "inline-chat"
env.player.runtime.type = "subprocess"
serve.pool.type = "elastic"
serve.pool.multiplex = 16

[orchestrator.eval]  # the 256 held-out expert games, every 10 steps
interval = 10

[[orchestrator.eval.source]]
name = "textworld-expert-eval"
env.taskset.id = "textworld-env"
env.taskset.dataset_path = "/network/scratch/e/emiliano.penaloza/kv-race/data/textworld_expert_cooking5x12_coin221-233_total50256_train50000_eval256_seed20261026"
env.taskset.split = "eval"
env.max_episode_steps = 200
env.player.max_total_tokens = 65536
env.player.harness.id = "inline-chat"
env.player.runtime.type = "subprocess"

[inference]
backend = "sglang"

[inference.vllm]  # engine-agnostic fields, translated for SGLang
max_model_len = 69632  # trace cap + one reply
gpu_memory_utilization = 0.9

[inference.sglang]
sessions = true  # one streaming session per trace (the KV-Streams path, no eviction)
max_mamba_cache_size = 600  # DeltaNet state slots per engine (~25 MB each at bf16 for 9B)
mamba_ssm_dtype = "bfloat16"
# For the KV-Streams arm add:
# mamba_radix_cache_strategy = "no_buffer"
# disable_overlap_schedule = true

[monitors.wandb]
project = "textworld-eviction-race"
name = "tw-expert-9b-fullctx-bs256-g8"
